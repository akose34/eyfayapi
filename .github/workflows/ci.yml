# Verification only — this workflow NEVER publishes anything (Stage 8).
#
# Runs the full quality gate on pull requests to main, on pushes to the redesign
# branch and on demand. It also uploads two downloadable build artifacts (kept
# 14 days, visible only to people with repository access):
#   - eyfayapi-dist          production build (what deploy.yml would publish)
#   - eyfayapi-staging-dist  SITE_INDEXING=off build for review (noindex + robots
#                            "Disallow: /"); download, unzip and serve locally:
#                            npx serve -s . or `npx astro preview` against it
# See docs/RELEASE_RUNBOOK.md §2 (staging).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['redesign/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (lockfile only)
        run: npm ci

      - name: Format, lint, astro check, unit tests, build, verify-dist
        run: npm run validate

      - name: Type check (astro check + tsc)
        run: npm run typecheck

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser smoke + accessibility tests (local build, network isolated)
        run: npx playwright test

      # actions/upload-artifact v7.0.2
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload production build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: eyfayapi-dist
          path: dist/
          retention-days: 14

      - name: Staging build (not indexable)
        env:
          SITE_INDEXING: 'off'
        run: |
          npx astro build --outDir dist-staging
          SITE_INDEXING=off node scripts/verify-dist.mjs --dist dist-staging

      - name: Upload staging build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: eyfayapi-staging-dist
          path: dist-staging/
          retention-days: 14
